<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初中英语单词听写</title>
    <link rel="stylesheet" href="/css/dictation.css">
</head>
<body>
<div class="app">
    <header class="topbar">
        <div>
            <h1>初中英语单词听写</h1>
            <p class="subtitle">外研版（新）七年级上册 · 勾选范围后乱序听写</p>
        </div>
        <a class="nav-link" href="/">返回象棋练习</a>
    </header>

    <p id="global-error" class="banner error hidden"></p>

    <section id="view-select" class="view">
        <div class="toolbar">
            <button type="button" id="btn-confirm">确认范围</button>
            <button type="button" id="btn-start" class="hidden primary">开始听写</button>
            <span id="select-status" class="hint"></span>
        </div>
        <div id="catalog"></div>
    </section>

    <section id="view-practice" class="view hidden">
        <p class="hint">界面不显示当前单词。请点击「读单词」，听美式发音后默写。请允许浏览器播放声音，建议使用 Chrome。</p>
        <p id="progress" class="progress">当前第 0 个 / 共 0 个</p>
        <div class="toolbar">
            <button type="button" id="btn-prev">上一个单词</button>
            <button type="button" id="btn-speak" class="primary">读单词</button>
            <button type="button" id="btn-next">下一个单词</button>
            <button type="button" id="btn-finish" class="hidden primary">完成听写</button>
        </div>
        <div class="interval-bar">
            <label for="interval-select">朗读间隔：</label>
            <select id="interval-select">
                <option value="2" selected>2 秒</option>
                <option value="3">3 秒</option>
                <option value="4">4 秒</option>
                <option value="5">5 秒</option>
            </select>
        </div>
        <p id="speak-status" class="hint"></p>
        <button type="button" id="btn-back-select" class="linkish">返回重新选词</button>
    </section>

    <section id="view-review" class="view hidden">
        <div class="toolbar">
            <h2>听写结果</h2>
            <button type="button" id="btn-new">再听一次</button>
        </div>
        <p id="review-status" class="hint">正在加载例句…</p>
        <div id="review-list"></div>
    </section>
</div>
<script src="/js/dictation.js"></script>
</body>
</html>
