<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际象棋练习</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
    <header class="topbar">
        <div>
            <h1>国际象棋练习</h1>
            <p class="subtitle">对弈电脑 · 候补棋协大师水平（约 Elo 2150）</p>
        </div>
        <a class="nav-link" href="/dictation.html">英语听写</a>
    </header>

    <main class="layout">
        <section class="board-panel">
            <div id="board" class="board" aria-label="棋盘"></div>
            <div class="controls">
                <button type="button" id="btn-white">执白新局</button>
                <button type="button" id="btn-black">执黑新局</button>
                <button type="button" id="btn-resign">认输</button>
            </div>
            <p id="status" class="status">正在加载引擎…</p>
        </section>

        <aside class="moves-panel">
            <h2>棋谱</h2>
            <ol id="moves" class="moves"></ol>
        </aside>
    </main>
</div>

<div id="promo" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="promo-title">
    <div class="modal-card">
        <h3 id="promo-title">升变</h3>
        <div class="promo-choices">
            <button type="button" data-piece="q"><img src="" data-white="wQ" data-black="bQ" alt="后"></button>
            <button type="button" data-piece="r"><img src="" data-white="wR" data-black="bR" alt="车"></button>
            <button type="button" data-piece="b"><img src="" data-white="wB" data-black="bB" alt="象"></button>
            <button type="button" data-piece="n"><img src="" data-white="wN" data-black="bN" alt="马"></button>
        </div>
    </div>
</div>

<script src="/js/chess.min.js"></script>
<script src="/js/game.js"></script>
</body>
</html>
